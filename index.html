<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadena de Estéticas — Gestión</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #FAF6F2;
    --card: #FFFFFF;
    --ink: #2B1E20;
    --ink-soft: #6E5A5C;
    --wine: #6B2737;
    --wine-dark: #521E2B;
    --rose: #C98A9C;
    --rose-pale: #F1DEE2;
    --sage: #7C8F63;
    --line: #E7D9D4;
    --danger: #A6432F;
  }
  .esth-root{ background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", ui-sans-serif, system-ui, sans-serif; min-height: 100%; box-sizing: border-box; }
  .esth-root *{ box-sizing: border-box; }
  .esth-serif{ font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif; }
  .esth-screen{ max-width: 480px; margin: 0 auto; padding: 32px 20px 60px; }
  .esth-screen.wide{ max-width: 900px; }
  .esth-eyebrow{ font-size: 13px; color: var(--ink-soft); margin: 0 0 4px; }
  .esth-title{ font-size: 26px; margin: 0 0 6px; font-weight: 600; }
  .esth-sub{ font-size: 14px; color: var(--ink-soft); margin: 0 0 20px; line-height: 1.5; }
  .esth-card{ background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 18px; }
  .esth-list{ display: flex; flex-direction: column; gap: 10px; }
  .esth-branch{ display: flex; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 16px 18px; cursor: pointer; text-align: left; width: 100%; font-size: 16px; color: var(--ink); }
  .esth-branch:hover{ border-color: var(--wine); }
  .esth-branch small{ display:block; color: var(--ink-soft); font-size: 12px; margin-top: 3px; font-weight: 400; }
  .esth-role-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .esth-role-btn{ border: 1px solid var(--line); background: var(--card); border-radius: 4px; padding: 26px 14px; cursor: pointer; text-align: center; color: var(--ink); }
  .esth-role-btn:hover{ border-color: var(--wine); }
  .esth-role-btn .esth-role-label{ font-size: 15px; font-weight: 600; margin-top: 8px; }
  .esth-role-btn .esth-role-desc{ font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .esth-btn{ border: none; border-radius: 3px; padding: 10px 16px; font-size: 13.5px; cursor: pointer; font-weight: 600; background: var(--wine); color: #fff; }
  .esth-btn:hover{ background: var(--wine-dark); }
  .esth-btn.secondary{ background: transparent; color: var(--wine); border: 1px solid var(--wine); }
  .esth-btn.ghost{ background: transparent; color: var(--ink-soft); padding: 8px 4px; font-weight: 500; }
  .esth-btn.danger{ background: var(--danger); }
  .esth-btn.block{ width: 100%; }
  .esth-btn:disabled{ opacity: .5; cursor: not-allowed; }
  .esth-field{ margin-bottom: 12px; }
  .esth-field label{ display:block; font-size: 11.5px; color: var(--ink-soft); margin-bottom: 4px; }
  .esth-field input, .esth-field select{ width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 3px; font-size: 13.5px; background: #fff; color: var(--ink); font-family: inherit; }
  .esth-field input:focus, .esth-field select:focus{ outline: 2px solid var(--rose); border-color: var(--wine); }
  .esth-field input[readonly]{ background: #F5EFEC; color: var(--ink-soft); }
  .esth-hint{ font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .esth-hint.warn{ color: var(--danger); }
  .esth-row{ display:flex; justify-content: space-between; align-items:center; gap: 10px; }
  .esth-top{ display:flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .esth-grid2{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .esth-section-title{ font-size: 13px; font-weight: 600; margin: 22px 0 10px; color: var(--wine-dark); }
  .esth-fieldset{ border: 1px solid var(--line); border-radius: 4px; padding: 14px; margin-bottom: 12px; }
  .esth-legend{ font-size: 11.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .esth-tabs{ display:flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; }
  .esth-tab{ padding: 9px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink-soft); border-bottom: 2px solid transparent; white-space: nowrap; background: none; border-top:none; border-left:none; border-right:none; font-family: inherit; }
  .esth-tab.active{ color: var(--wine); border-bottom-color: var(--wine); font-weight: 600; }
  .esth-table{ width: 100%; border-collapse: collapse; font-size: 13px; }
  .esth-table th{ text-align: left; font-weight: 500; color: var(--ink-soft); font-size: 11.5px; padding: 7px 6px; border-bottom: 1px solid var(--line); }
  .esth-table td{ padding: 8px 6px; border-bottom: 1px solid var(--line); }
  .esth-table tr:last-child td{ border-bottom: none; }
  .esth-money{ font-variant-numeric: tabular-nums; }
  .esth-empty{ color: var(--ink-soft); font-size: 13px; padding: 18px 0; text-align: center; }
  .esth-error{ background: #FBEAE6; color: var(--danger); border: 1px solid #EBC3B8; padding: 9px 11px; border-radius: 3px; font-size: 12.5px; margin-bottom: 12px; }
  .esth-ok{ background: #EEF1E8; color: var(--sage); border: 1px solid #D3DCC3; padding: 9px 11px; border-radius: 3px; font-size: 12.5px; margin-bottom: 12px; }
  .esth-summary-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 20px; }
  .esth-summary-box{ border: 1px solid var(--line); border-radius: 4px; padding: 13px; background: var(--card); }
  .esth-summary-box .n{ font-size: 19px; font-weight: 600; }
  .esth-summary-box .l{ font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .esth-icon-btn{ background:none; border:none; color: var(--ink-soft); cursor:pointer; font-size: 12px; padding: 3px 5px; }
  .esth-icon-btn:hover{ color: var(--danger); }
  .esth-tag{ display:inline-block; font-size: 10.5px; padding: 2px 7px; border-radius: 10px; background: var(--rose-pale); color: var(--wine-dark); }
  .esth-modal-backdrop{ position: fixed; inset: 0; background: rgba(43,30,32,.45); display:flex; align-items:center; justify-content:center; z-index: 50; padding: 20px; }
  .esth-modal{ background: #fff; border-radius: 6px; padding: 22px; max-width: 320px; width: 100%; text-align: center; }
  .esth-pin-input{ font-size: 26px; text-align: center; letter-spacing: 8px; }
  @media (max-width: 420px){ .esth-summary-grid{ grid-template-columns: 1fr 1fr; } .esth-grid2{ grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="esth-app" class="esth-root"></div>
<script>
(function(){
  const STORAGE_KEY = 'salon-chain-data-v6';
  const V5_STORAGE_KEY = 'salon-chain-data-v5';
  const V4_STORAGE_KEY = 'salon-chain-data-v4';

  const svc = (id,name,price,category,variable) => ({ id, name, category, price: variable ? null : price, variable: !!variable });

  const defaultState = () => ({
    chainName: 'Mi Cadena de Estéticas',
    settings: { masterPin: '130908', priceOverridePin: '' },
    admins: [ { id: 'a1', user: 'admin', pass: '1234', role: 'propietario', branchIds: [], pin: '' } ],
    branches: [
      { id: 'b1', name: 'Sucursal 1', address: '',
        cashier: { user: 'cajero', pass: '1234' },
        services: [], stylists: [], sales: [], products: [],
        insumos: { items: [] }
      }
    ]
  });

  function migrateFromV4(old){
    (old.branches || []).forEach(b => {
      if (!b.products) b.products = [];
      if (!b.insumos) b.insumos = { items: [], decolorantePorGramo: null };
      if (b.insumos.tinteFractions && !b.insumos.items){ b.insumos.items = b.insumos.tinteFractions; delete b.insumos.tinteFractions; }
      if (!b.insumos.items) b.insumos.items = [];
    });
    return old;
  }

  function migrateFromV5(old){
    (old.branches || []).forEach(b => {
      if (!b.insumos) b.insumos = { items: [] };
      (b.insumos.items || []).forEach(it => { if (!it.mode) it.mode = 'fijo'; });
      if (b.insumos.decolorantePorGramo !== undefined && b.insumos.decolorantePorGramo !== null){
        b.insumos.items = b.insumos.items || [];
        b.insumos.items.push({ id: uid('f'), label: 'Decolorante', mode: 'cantidad', unit: 'gramo', price: b.insumos.decolorantePorGramo });
      }
      delete b.insumos.decolorantePorGramo;
    });
    return old;
  }

  let state = null;
  let view = { screen: 'home', branchId: null, adminTab: 'resumen', error: '', adminUserId: null };
  let pinModal = null;   // { expected, message, error, onConfirm() }
  let cashModal = null;  // { total, onConfirm(recibido) }
  let ticket = { stylistId: null, stylistExternal: null, items: [] };
  let cashierOpenPanels = { porEstilista: false };
  let pendingInsumos = []; // insumos que se van agregando para el servicio que se está por cobrar

  function pendingInsumosTotal(){ return pendingInsumos.reduce((a, p) => a + p.monto, 0); }

  // Acepta enteros, decimales (9.1), fracciones (1/8) y números mixtos (7 1/2) para cantidades de insumo.
  function parseQty(raw){
    if (raw == null) return NaN;
    const s = String(raw).trim().replace(',', '.');
    if (s === '') return NaN;
    const mixed = s.match(/^(-?\d+(?:\.\d+)?)\s+(\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (mixed){
      const whole = parseFloat(mixed[1]), num = parseFloat(mixed[2]), den = parseFloat(mixed[3]);
      if (!den) return NaN;
      const frac = num / den;
      return whole < 0 ? whole - frac : whole + frac;
    }
    const frac = s.match(/^(-?\d+(?:\.\d+)?)\/(\d+(?:\.\d+)?)$/);
    if (frac){
      const num = parseFloat(frac[1]), den = parseFloat(frac[2]);
      if (!den) return NaN;
      return num / den;
    }
    const val = parseFloat(s);
    return isNaN(val) ? NaN : val;
  }

  const uid = (p) => p + Math.random().toString(36).slice(2, 8);
  const money = (n) => '$' + Number(n || 0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const todayStr = () => new Date().toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
  const isToday = (iso) => { const d = new Date(iso), t = new Date(); return d.toDateString() === t.toDateString(); };
  // Devuelve todos los PIN válidos para autorizar un cambio de precio/insumo en una sucursal:
  // el PIN maestro de autorización (dueños) + el PIN personal de cualquier encargado/propietario con acceso a esa sucursal.
  function getValidAuthPins(branchId){
    const pins = [];
    if (state.settings.priceOverridePin) pins.push(state.settings.priceOverridePin);
    state.admins.forEach(a => {
      if (!a.pin || a.role === 'cajero') return;
      if (a.role === 'propietario' || (a.branchIds || []).includes(branchId)) pins.push(a.pin);
    });
    return [...new Set(pins)];
  }
  const needsPriceAuth = (b) => getValidAuthPins(b.id).length > 0;

  function normalizeState(){
    (state.admins || []).forEach(a => { if (a.pin === undefined || a.pin === null) a.pin = ''; });
  }

  async function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ console.error('storage set failed', e); } }
  async function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw){ state = JSON.parse(raw); normalizeState(); return; }
      const raw5 = localStorage.getItem(V5_STORAGE_KEY);
      if (raw5){ state = migrateFromV5(JSON.parse(raw5)); normalizeState(); await save(); return; }
      const raw4 = localStorage.getItem(V4_STORAGE_KEY);
      if (raw4){ state = migrateFromV5(migrateFromV4(JSON.parse(raw4))); normalizeState(); await save(); return; }
      state = defaultState();
    } catch(e){ state = defaultState(); }
  }

  function branch(){ return state.branches.find(b => b.id === view.branchId); }
  function currentAdmin(){ return state.admins.find(a => a.id === view.adminUserId); }
  function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function root(){ return document.getElementById('esth-app'); }

  function computeTotals(b){
    const today = b.sales.filter(s => isToday(s.date));
    const servicios = today.filter(s => s.type === 'servicio');
    const productos = today.filter(s => s.type === 'producto');
    const gastos = today.filter(s => s.type === 'gasto');
    const totalServicios = servicios.reduce((a,s)=>a+s.price,0);
    const totalProductos = productos.reduce((a,s)=>a+s.price,0);
    const totalGastos = gastos.reduce((a,s)=>a+s.amount,0);
    const totalBaucher = servicios.filter(s=>s.method==='Baucher').reduce((a,s)=>a+s.price,0);
    const efectivoServicios = servicios.filter(s=>s.method==='Efectivo').reduce((a,s)=>a+s.price,0);
    const efectivoNeto = efectivoServicios + totalProductos - totalGastos;
    const totalUniversal = totalServicios + totalProductos - totalGastos;
    const porEstilista = {};
    servicios.forEach(s => {
      if (!porEstilista[s.stylistName]) porEstilista[s.stylistName] = { nombre: s.stylistName, servicios: 0, bruto: 0, descuento: 0 };
      const row = porEstilista[s.stylistName];
      row.servicios += 1; row.bruto += s.price; row.descuento += (s.descuentoInsumos||0);
    });
    return { today, servicios, productos, gastos, totalServicios, totalProductos, totalGastos, totalBaucher, efectivoNeto, totalUniversal, porEstilista: Object.values(porEstilista) };
  }

  function renderStylistTable(t){
    if (t.porEstilista.length === 0) return el(`<p class="esth-empty">Sin servicios registrados hoy.</p>`);
    const table = el(`<table class="esth-table"><thead><tr><th>Estilista</th><th>Servicios</th><th style="text-align:right;">Bruto</th><th style="text-align:right;">Desc. insumos</th><th style="text-align:right;">Neto</th></tr></thead><tbody></tbody></table>`);
    const tbody = table.querySelector('tbody');
    t.porEstilista.forEach(r => tbody.appendChild(el(`<tr><td>${r.nombre}</td><td>${r.servicios}</td>
      <td class="esth-money" style="text-align:right;">${money(r.bruto)}</td>
      <td class="esth-money" style="text-align:right;">${money(r.descuento)}</td>
      <td class="esth-money" style="text-align:right;font-weight:600;">${money(r.bruto-r.descuento)}</td></tr>`)));
    return table;
  }

  function exportBranchExcel(b, t){
    if (typeof XLSX === 'undefined'){ alert('No se pudo cargar el módulo de Excel. Revisa tu conexión.'); return; }
    const movRows = [['Tipo','Detalle','Estilista','Método','Monto']];
    t.today.forEach(m => {
      if (m.type === 'servicio') movRows.push(['Servicio', m.serviceName, m.stylistName, m.method, m.price]);
      else if (m.type === 'producto') movRows.push(['Producto', m.name, '', '', m.price]);
      else movRows.push(['Gasto', m.concept, '', '', -m.amount]);
    });
    const stRows = [['Estilista','Servicios','Bruto','Descuento insumos','Neto']];
    t.porEstilista.forEach(r => stRows.push([r.nombre, r.servicios, r.bruto, r.descuento, r.bruto-r.descuento]));
    const resumenRows = [['Concepto','Monto'],
      ['Total servicios', t.totalServicios], ['Ventas productos', t.totalProductos],
      ['Gastos', t.totalGastos], ['Baucher', t.totalBaucher], ['Efectivo neto', t.efectivoNeto], ['Total universal', t.totalUniversal]];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumenRows), 'Resumen');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(stRows), 'Por estilista');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(movRows), 'Movimientos');
    XLSX.writeFile(wb, `corte-caja-${b.name.replace(/\s+/g,'-')}-${new Date().toISOString().slice(0,10)}.xlsx`);
  }

  function render(){
    root().innerHTML = '';
    root().appendChild(screens[view.screen]());
    if (pinModal) root().appendChild(renderPinModal());
    if (cashModal) root().appendChild(renderCashModal());
  }

  function renderCashModal(){
    const wrap = el(`<div class="esth-modal-backdrop"><div class="esth-modal">
      <p class="esth-eyebrow esth-serif">Cobro en efectivo</p>
      <h2 class="esth-title esth-serif" style="font-size:19px;">Total a pagar: ${money(cashModal.total)}</h2>
      ${cashModal.error ? `<p class="esth-error">${cashModal.error}</p>` : ''}
      <div class="esth-field" style="margin-top:12px;text-align:left;"><label>¿Cuánto dio el cliente? ($)</label>
        <input class="esth-pin-input" id="cash-in" type="number" min="0" step="0.5" style="letter-spacing:normal;font-size:20px;"/></div>
      <p class="esth-title esth-serif" id="cash-change" style="font-size:20px;color:var(--wine);margin:10px 0 16px;">Cambio: ${money(0)}</p>
      <div class="esth-row">
        <button class="esth-btn ghost" id="cash-cancel">Cancelar</button>
        <button class="esth-btn" id="cash-ok">Confirmar cobro</button>
      </div>
    </div></div>`);
    const input = wrap.querySelector('#cash-in');
    const changeLabel = wrap.querySelector('#cash-change');
    input.addEventListener('input', () => {
      const recibido = parseFloat(input.value) || 0;
      changeLabel.textContent = 'Cambio: ' + money(Math.max(0, recibido - cashModal.total));
    });
    wrap.querySelector('#cash-cancel').onclick = () => { cashModal = null; render(); };
    const doConfirm = () => {
      const recibido = parseFloat(input.value);
      if (isNaN(recibido) || recibido < 0){ cashModal = { ...cashModal, error: 'Ingresa cuánto dio el cliente.' }; render(); return; }
      if (recibido < cashModal.total){ cashModal = { ...cashModal, error: 'El efectivo recibido es menor al total a pagar.' }; render(); return; }
      const fn = cashModal.onConfirm; cashModal = null; fn(recibido);
    };
    wrap.querySelector('#cash-ok').onclick = doConfirm;
    input.addEventListener('keydown', e => { if (e.key === 'Enter') doConfirm(); });
    setTimeout(() => input.focus(), 0);
    return wrap;
  }

  function renderPinModal(){
    const wrap = el(`<div class="esth-modal-backdrop"><div class="esth-modal">
      <p class="esth-eyebrow esth-serif">Autorización requerida</p>
      <h2 class="esth-title esth-serif" style="font-size:19px;">${pinModal.title || 'Ingresa el PIN'}</h2>
      <p class="esth-sub" style="margin-bottom:14px;">${pinModal.message || ''}</p>
      ${pinModal.error ? `<p class="esth-error">${pinModal.error}</p>` : ''}
      <div class="esth-field"><input class="esth-pin-input" id="pin-in" type="password" maxlength="10" placeholder="••••"/></div>
      <div class="esth-row">
        <button class="esth-btn ghost" id="pin-cancel">Cancelar</button>
        <button class="esth-btn" id="pin-ok">Autorizar</button>
      </div>
    </div></div>`);
    wrap.querySelector('#pin-cancel').onclick = () => { pinModal = null; render(); };
    const doConfirm = () => {
      const val = wrap.querySelector('#pin-in').value;
      const valid = pinModal.expectedList ? (val && pinModal.expectedList.includes(val)) : val === pinModal.expected;
      if (valid){ const fn = pinModal.onConfirm; pinModal = null; fn(); }
      else { pinModal = { ...pinModal, error: 'PIN incorrecto.' }; render(); }
    };
    wrap.querySelector('#pin-ok').onclick = doConfirm;
    wrap.querySelector('#pin-in').addEventListener('keydown', e => { if (e.key === 'Enter') doConfirm(); });
    setTimeout(() => wrap.querySelector('#pin-in').focus(), 0);
    return wrap;
  }

  // ---------- HOME ----------
  function screenHome(){
    const wrap = el(`<div class="esth-screen"><p class="esth-eyebrow esth-serif">Bienvenido</p>
      <h1 class="esth-title esth-serif">${state.chainName}</h1>
      <p class="esth-sub">Elige la sucursal donde vas a trabajar hoy.</p>
      <div class="esth-list" id="branch-list"></div></div>`);
    const list = wrap.querySelector('#branch-list');
    state.branches.forEach(b => {
      const btn = el(`<button class="esth-branch"><span>${b.name}<small>${b.address || ''}</small></span><span>›</span></button>`);
      btn.onclick = () => { view = { screen: 'role', branchId: b.id, adminTab: 'resumen', error: '', adminUserId: null }; ticket = { stylistId: null, stylistExternal: null, items: [] }; pendingInsumos = []; render(); };
      list.appendChild(btn);
    });
    return wrap;
  }

  // ---------- ROLE ----------
  function screenRole(){
    const b = branch();
    const wrap = el(`<div class="esth-screen">
      <button class="esth-btn ghost" id="back">‹ Cambiar de sucursal</button>
      <p class="esth-eyebrow esth-serif" style="margin-top:14px;">${b.name}</p>
      <h1 class="esth-title esth-serif">¿Cómo quieres entrar?</h1>
      <p class="esth-sub">Selecciona tu rol para continuar.</p>
      <div class="esth-role-grid">
        <button class="esth-role-btn" id="go-cashier"><div class="esth-role-label">Cajero</div><div class="esth-role-desc">Corte de caja del día</div></button>
        <button class="esth-role-btn" id="go-admin"><div class="esth-role-label">Administrador</div><div class="esth-role-desc">Precios, estilistas y reportes</div></button>
      </div></div>`);
    wrap.querySelector('#back').onclick = () => { view = { screen: 'home', branchId: null, error: '' }; render(); };
    wrap.querySelector('#go-cashier').onclick = () => { view = { ...view, screen: 'cashierLogin', error: '' }; render(); };
    wrap.querySelector('#go-admin').onclick = () => { view = { ...view, screen: 'adminLogin', error: '' }; render(); };
    return wrap;
  }

  // ---------- CASHIER LOGIN ----------
  function screenCashierLogin(){
    const b = branch();
    const wrap = el(`<div class="esth-screen">
      <button class="esth-btn ghost" id="back">‹ Volver</button>
      <p class="esth-eyebrow esth-serif" style="margin-top:14px;">${b.name} · Cajero</p>
      <h1 class="esth-title esth-serif">Iniciar sesión</h1>
      <p class="esth-sub">Ingresa el usuario y contraseña de esta sucursal.</p>
      <div class="esth-card">
        ${view.error ? `<p class="esth-error">${view.error}</p>` : ''}
        <div class="esth-field"><label>Usuario</label><input id="in-user" type="text" autocomplete="username"/></div>
        <div class="esth-field"><label>Contraseña</label><input id="in-pass" type="password" autocomplete="current-password"/></div>
        <button class="esth-btn block" id="submit">Entrar</button>
      </div></div>`);
    wrap.querySelector('#back').onclick = () => { view = { screen: 'role', branchId: b.id, error: '' }; render(); };
    const doLogin = () => {
      const u = wrap.querySelector('#in-user').value.trim();
      const p = wrap.querySelector('#in-pass').value;
      const cashierAdmin = state.admins.find(a => a.role === 'cajero' && a.user === u && a.pass === p && (a.branchIds||[]).includes(b.id));
      if ((u === b.cashier.user && p === b.cashier.pass) || cashierAdmin){ ticket = { stylistId: null, stylistExternal: null, items: [] }; pendingInsumos = []; view = { ...view, screen: 'cashier', error: '' }; }
      else view = { ...view, error: 'Usuario o contraseña incorrectos.' };
      render();
    };
    wrap.querySelector('#submit').onclick = doLogin;
    wrap.querySelector('#in-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    return wrap;
  }

  // ---------- CASHIER ----------
  function screenCashier(){
    const b = branch();
    const t = computeTotals(b);
    const categories = [...new Set(b.services.map(s=>s.category))];
    const ticketTotal = ticket.items.reduce((a,i)=>a+i.price,0);
    const lockedStylist = ticket.items.length > 0;
    const stylistObj = ticket.stylistId ? b.stylists.find(e => e.id === ticket.stylistId) : null;
    const lockedStylistLabel = ticket.stylistExternal
      ? `${ticket.stylistExternal.name} — Invitado (${ticket.stylistExternal.origen})`
      : (stylistObj ? stylistObj.name : '');

    const wrap = el(`<div class="esth-screen">
      <div class="esth-top">
        <div><p class="esth-eyebrow esth-serif">${b.name} · Cajero</p><h1 class="esth-title esth-serif">Corte de caja</h1></div>
        <button class="esth-btn ghost" id="exit">Salir</button>
      </div>
      <p class="esth-eyebrow esth-serif" style="margin-bottom:16px;">${todayStr()}</p>

      <div class="esth-card" id="form-servicio">
        <p class="esth-legend" style="font-weight:600;font-size:13px;color:var(--wine-dark);margin-bottom:10px;">Cuenta actual</p>
        <div class="esth-field"><label>Estilista</label>
          ${lockedStylist
            ? `<input type="text" value="${lockedStylistLabel}" readonly/>`
            : `<select id="sel-stylist">${b.stylists.map(e => `<option value="${e.id}">${e.name}</option>`).join('') || '<option value="">Sin estilistas</option>'}<option value="__external__">+ Estilista invitado (de otra estética)</option></select>`}
          ${lockedStylist ? '<p class="esth-hint">Vacía la cuenta para cambiar de estilista.</p>' : ''}
        </div>
        <div class="esth-field" id="ext-stylist-wrap" style="display:none;">
          <label>Nombre del estilista invitado</label><input id="ext-stylist-name" type="text" placeholder="Nombre completo"/>
          <label style="margin-top:8px;">Sucursal / estética de origen</label><input id="ext-stylist-branch" type="text" placeholder="Ej. Estética Bella Rosa, sucursal Centro"/>
          <p class="esth-hint warn">🔒 Se pedirá el PIN de un encargado o propietario para agregar un servicio a este estilista.</p>
          <p class="esth-hint" id="ext-stylist-error" style="display:none;color:var(--danger);"></p>
        </div>
        <div class="esth-field"><label>Servicio</label><select id="sel-service">
          ${categories.map(cat => `<optgroup label="${cat}">${b.services.filter(s=>s.category===cat).map(s=>
            `<option value="${s.id}" data-price="${s.price ?? ''}" data-variable="${s.variable}">${s.name}${s.variable ? ' (precio variable)' : ' — '+money(s.price)}</option>`).join('')}</optgroup>`).join('') || '<option value="">Sin servicios</option>'}
        </select></div>
        <div class="esth-field"><label>Monto a cobrar ($)</label><input id="in-monto" type="number" min="0" step="0.5"/>
          <p class="esth-hint warn" id="pin-hint" style="display:none;">🔒 Este precio difiere del precio base${needsPriceAuth(b) ? ': se pedirá PIN de autorización.' : '.'}</p>
        </div>
        <div class="esth-fieldset">
          <p class="esth-legend">Insumos usados en este servicio (agrega uno por uno: tintes, decolorante, etc. — se van sumando)</p>
          <div class="esth-field"><label>Insumo</label><select id="in-insumo">
            <option value="">Selecciona un insumo…</option>
            ${b.insumos.items.map(f => `<option value="${f.id}" data-mode="${f.mode}" data-price="${f.price}" data-unit="${f.unit||''}" data-label="${f.label}">${f.label}${f.mode==='cantidad' ? ' (' + money(f.price) + ' / ' + (f.unit==='ml'?'ml':'g') + ')' : ' (' + money(f.price) + ')'}</option>`).join('')}
          </select></div>
          <div class="esth-field" id="insumo-qty-wrap" style="display:none;"><label id="insumo-qty-label">Cantidad</label>
            <input id="in-insumo-qty" type="text" inputmode="decimal" placeholder="Ej. 7 1/2, 3/4, 1/8, 45"/>
            <p class="esth-hint">Puedes escribir fracciones (1/2, 3/4, 1/8), mixtos (7 1/2) o decimales (9.1).</p>
          </div>
          <div class="esth-field"><label>Monto de esta línea ($)</label><input id="in-insumo-monto" type="number" min="0" step="0.5" value="0"/>
            <p class="esth-hint warn" id="insumo-pin-hint" style="display:none;">🔒 Este monto no coincide con el cálculo automático${needsPriceAuth(b) ? ': se pedirá PIN de autorización.' : '.'}</p>
          </div>
          <p class="esth-hint" id="insumo-line-error" style="display:none;color:var(--danger);"></p>
          <button class="esth-btn secondary block" id="btn-add-insumo-line" type="button">+ Agregar insumo a este servicio</button>
          <div id="insumo-list" style="margin-top:10px;"></div>
          <p class="esth-hint" id="insumos-total" style="font-weight:600;margin-top:6px;">Descuento total de insumos: ${money(pendingInsumosTotal())}</p>
        </div>
        <button class="esth-btn secondary block" id="btn-add-line" ${b.services.length===0||b.stylists.length===0?'disabled':''}>+ Agregar a la cuenta</button>

        <div id="ticket-box" style="margin-top:16px;"></div>

        <div class="esth-fieldset" style="margin-top:14px;">
          <p class="esth-legend">Cobro en caja</p>
          <div class="esth-field"><label>Método de pago</label><select id="sel-method">
            <option value="Efectivo">Efectivo</option><option value="Baucher">Tarjeta / Baucher</option>
          </select></div>
        </div>
        <button class="esth-btn block" id="btn-cobrar" ${ticket.items.length===0?'disabled':''}>Cobrar cuenta (${money(ticketTotal)})</button>
      </div>

      <p class="esth-section-title">Venta de producto</p>
      <div class="esth-card">
        <div class="esth-field"><label>Código de barras (opcional)</label><input id="prod-barcode" type="text" placeholder="Escanea o escribe el código y presiona Enter"/></div>
        <div class="esth-field"><label>Producto</label><select id="prod-select" ${b.products.length===0?'disabled':''}>
          <option value="">${b.products.length===0 ? 'No hay productos cargados' : 'Selecciona un producto…'}</option>
          ${b.products.map(p => `<option value="${p.id}" data-price="${p.price}" data-commission="${p.commission}">${p.name}${p.barcode ? ' · '+p.barcode : ''} — ${money(p.price)}</option>`).join('')}
        </select></div>
        <div class="esth-grid2">
          <div class="esth-field"><label>Precio</label><input id="prod-precio" type="text" readonly value=""/></div>
          <div class="esth-field"><label>Comisión</label><input id="prod-comision" type="text" readonly value=""/></div>
        </div>
        <p class="esth-hint" id="prod-msg"></p>
        <button class="esth-btn secondary block" id="btn-producto" disabled>Agregar venta</button>
      </div>

      <p class="esth-section-title">Registro de gastos</p>
      <div class="esth-card">
        <div class="esth-field"><label>Concepto</label><input id="gasto-concepto" type="text" placeholder="Ej. Garrafón, insumos"/></div>
        <div class="esth-field"><label>Monto ($)</label><input id="gasto-monto" type="number" min="0" step="0.5"/></div>
        <button class="esth-btn danger block" id="btn-gasto">Agregar gasto</button>
      </div>

      <div class="esth-row" style="margin-top:22px;margin-bottom:10px;">
        <p class="esth-section-title" style="margin:0;">Resumen de hoy</p>
        <button class="esth-btn secondary" id="export-xlsx-cashier">Exportar a Excel</button>
      </div>
      <div class="esth-summary-grid">
        <div class="esth-summary-box"><div class="n">${money(t.totalServicios)}</div><div class="l">Servicios</div></div>
        <div class="esth-summary-box"><div class="n">${money(t.totalProductos)}</div><div class="l">Productos</div></div>
        <div class="esth-summary-box"><div class="n">${money(t.totalGastos)}</div><div class="l">Gastos</div></div>
        <div class="esth-summary-box"><div class="n">${money(t.totalBaucher)}</div><div class="l">Baucher</div></div>
        <div class="esth-summary-box"><div class="n">${money(t.efectivoNeto)}</div><div class="l">Efectivo neto</div></div>
        <div class="esth-summary-box"><div class="n">${money(t.totalUniversal)}</div><div class="l">Total universal</div></div>
      </div>

      <button class="esth-btn ghost" id="toggle-stylist" style="padding-left:0;">${cashierOpenPanels.porEstilista ? '▾' : '▸'} Ver por estilista</button>
      <div id="stylist-panel" style="display:${cashierOpenPanels.porEstilista?'block':'none'};margin-bottom:18px;"></div>

      <div id="movs" class="esth-card"></div>
    </div>`);

    wrap.querySelector('#exit').onclick = () => { view = { screen: 'role', branchId: b.id, error: '' }; pendingInsumos = []; render(); };

    const stylistSel = wrap.querySelector('#sel-stylist');
    const extWrap = wrap.querySelector('#ext-stylist-wrap');
    const extError = wrap.querySelector('#ext-stylist-error');
    if (stylistSel){
      stylistSel.addEventListener('change', () => { extWrap.style.display = stylistSel.value === '__external__' ? 'block' : 'none'; extError.style.display = 'none'; });
    }

    // live price default + PIN hint
    const serviceSel = wrap.querySelector('#sel-service');
    const montoInput = wrap.querySelector('#in-monto');
    const pinHint = wrap.querySelector('#pin-hint');
    const applyServiceDefault = () => {
      const opt = serviceSel.selectedOptions[0];
      if (!opt) return;
      const isVar = opt.dataset.variable === 'true';
      montoInput.value = isVar ? '' : opt.dataset.price;
      updatePinHint();
    };
    const updatePinHint = () => {
      const opt = serviceSel.selectedOptions[0];
      if (!opt) { pinHint.style.display = 'none'; return; }
      const isVar = opt.dataset.variable === 'true';
      const base = parseFloat(opt.dataset.price);
      const current = parseFloat(montoInput.value);
      const differs = !isVar && !isNaN(current) && !isNaN(base) && current !== base;
      pinHint.style.display = differs ? 'block' : 'none';
    };
    serviceSel.addEventListener('change', applyServiceDefault);
    montoInput.addEventListener('input', updatePinHint);
    applyServiceDefault();

    const insumoSel = wrap.querySelector('#in-insumo');
    const insumoMontoInput = wrap.querySelector('#in-insumo-monto');
    const insumoPinHint = wrap.querySelector('#insumo-pin-hint');
    const insumoLineError = wrap.querySelector('#insumo-line-error');
    const qtyWrap = wrap.querySelector('#insumo-qty-wrap');
    const qtyLabel = wrap.querySelector('#insumo-qty-label');
    const qtyInput = wrap.querySelector('#in-insumo-qty');
    const insumosLabel = wrap.querySelector('#insumos-total');

    // calcula el subtotal automático de la línea actual (insumo + cantidad); NaN si la cantidad es inválida
    const computeInsumoBase = () => {
      const opt = insumoSel.selectedOptions[0];
      if (!opt || !opt.value) return 0;
      const price = parseFloat(opt.dataset.price) || 0;
      if (opt.dataset.mode === 'cantidad'){
        const qty = parseQty(qtyInput.value);
        return isNaN(qty) ? NaN : price * qty;
      }
      return price;
    };
    const updateQtyVisibility = () => {
      const opt = insumoSel.selectedOptions[0];
      if (opt && opt.value && opt.dataset.mode === 'cantidad'){
        qtyWrap.style.display = 'block';
        qtyLabel.textContent = 'Cantidad (' + (opt.dataset.unit === 'ml' ? 'ml' : 'gramos') + ')';
      } else { qtyWrap.style.display = 'none'; }
    };
    const updateInsumoPinHint = () => {
      const base = computeInsumoBase();
      const current = parseFloat(insumoMontoInput.value);
      insumoPinHint.style.display = (!isNaN(base) && !isNaN(current) && current !== base) ? 'block' : 'none';
    };
    const applyInsumoDefault = () => {
      updateQtyVisibility();
      const base = computeInsumoBase();
      insumoMontoInput.value = isNaN(base) ? '' : base;
      updateInsumoPinHint();
    };
    insumoSel.addEventListener('change', applyInsumoDefault);
    qtyInput.addEventListener('input', applyInsumoDefault);
    insumoMontoInput.addEventListener('input', updateInsumoPinHint);
    applyInsumoDefault();

    const renderInsumoList = () => {
      const listBox = wrap.querySelector('#insumo-list');
      listBox.innerHTML = '';
      if (pendingInsumos.length === 0){
        listBox.appendChild(el(`<p class="esth-empty" style="padding:8px 0;">Aún no agregas insumos a este servicio.</p>`));
      } else {
        const table = el(`<table class="esth-table"><tbody></tbody></table>`);
        const tbody = table.querySelector('tbody');
        pendingInsumos.forEach(p => {
          const qtyText = p.mode === 'cantidad' ? ` — ${p.qtyRaw}${p.unit === 'ml' ? 'ml' : 'g'}` : '';
          const row = el(`<tr><td>${p.label}${qtyText}</td>
            <td class="esth-money" style="text-align:right;">${money(p.monto)}</td>
            <td style="text-align:right;"><button class="esth-icon-btn">Quitar</button></td></tr>`);
          row.querySelector('button').onclick = () => { pendingInsumos = pendingInsumos.filter(x => x.id !== p.id); render(); };
          tbody.appendChild(row);
        });
        listBox.appendChild(table);
      }
      insumosLabel.textContent = 'Descuento total de insumos: ' + money(pendingInsumosTotal());
    };
    renderInsumoList();

    wrap.querySelector('#btn-add-insumo-line').onclick = () => {
      const opt = insumoSel.selectedOptions[0];
      insumoLineError.style.display = 'none';
      if (!opt || !opt.value){ insumoLineError.textContent = 'Selecciona un insumo.'; insumoLineError.style.display = 'block'; return; }
      const mode = opt.dataset.mode;
      const qtyRaw = qtyInput.value.trim();
      const qty = mode === 'cantidad' ? parseQty(qtyRaw) : 1;
      if (mode === 'cantidad' && (qtyRaw === '' || isNaN(qty))){ insumoLineError.textContent = 'Ingresa una cantidad válida (ej. 7 1/2, 3/4, 45).'; insumoLineError.style.display = 'block'; return; }
      const base = computeInsumoBase();
      const monto = parseFloat(insumoMontoInput.value);
      if (isNaN(monto) || monto < 0){ insumoLineError.textContent = 'Ingresa un monto válido para esta línea.'; insumoLineError.style.display = 'block'; return; }
      pendingInsumos.push({
        id: uid('pi'), insumoId: opt.value, label: opt.dataset.label, mode, unit: opt.dataset.unit,
        qty, qtyRaw: mode === 'cantidad' ? qtyRaw : '', base, monto, overridden: !isNaN(base) && monto !== base
      });
      insumoSel.value = '';
      qtyInput.value = '';
      insumoMontoInput.value = 0;
      applyInsumoDefault();
      render();
    };

    // agregar línea (servicio + insumos acumulados) a la cuenta
    wrap.querySelector('#btn-add-line').onclick = () => {
      const opt = serviceSel.selectedOptions[0];
      if (!opt) return;

      // resolver estilista: el ya fijado en la cuenta, o uno nuevo (interno o invitado externo)
      let stylist = null, isNewExternal = false, extName = '', extOrigen = '';
      if (lockedStylist){
        if (ticket.stylistExternal){ extName = ticket.stylistExternal.name; extOrigen = ticket.stylistExternal.origen; }
        else stylist = b.stylists.find(e => e.id === ticket.stylistId);
      } else {
        const selVal = stylistSel.value;
        if (selVal === '__external__'){
          extName = wrap.querySelector('#ext-stylist-name').value.trim();
          extOrigen = wrap.querySelector('#ext-stylist-branch').value.trim();
          if (!extName || !extOrigen){
            extError.textContent = 'Ingresa el nombre del estilista invitado y la sucursal/estética de origen.';
            extError.style.display = 'block';
            return;
          }
          isNewExternal = true;
        } else {
          stylist = b.stylists.find(e => e.id === selVal);
        }
      }
      if (!stylist && !extName) return;

      const isVar = opt.dataset.variable === 'true';
      const base = parseFloat(opt.dataset.price);
      const monto = parseFloat(montoInput.value);
      if (isNaN(monto) || monto < 0) return;
      const insumosUsados = pendingInsumos.slice();
      const descuentoInsumos = insumosUsados.reduce((a, p) => a + p.monto, 0);
      const serviceName = opt.textContent.split(' — ')[0].replace(' (precio variable)','');

      const addLine = () => {
        if (!lockedStylist){
          if (isNewExternal){ ticket.stylistExternal = { name: extName, origen: extOrigen }; ticket.stylistId = null; }
          else { ticket.stylistId = stylist.id; ticket.stylistExternal = null; }
        }
        ticket.items.push({ id: uid('t'), serviceName, basePrice: isVar ? null : base, price: monto, descuentoInsumos, insumosUsados });
        pendingInsumos = [];
        render();
      };

      // autorizaciones necesarias, en orden: estilista invitado nuevo, precio distinto al base, insumo distinto al calculado
      const validPins = getValidAuthPins(b.id);
      const steps = [];
      if (isNewExternal) steps.push('Vas a registrar un servicio para "' + extName + '", estilista invitado de "' + extOrigen + '". Autoriza con el PIN de un encargado o propietario.');
      if (!isVar && monto !== base && needsPriceAuth(b)) steps.push('El monto (' + money(monto) + ') difiere del precio base (' + money(base) + ') de "' + serviceName + '". Autoriza con PIN (dueño o encargado).');
      if (insumosUsados.some(p => p.overridden) && needsPriceAuth(b)) steps.push('Uno o más montos de insumo no coinciden con el cálculo automático. Autoriza con PIN (dueño o encargado).');

      const runSteps = (idx) => {
        if (idx >= steps.length){ addLine(); return; }
        if (validPins.length === 0){ runSteps(idx + 1); return; } // sin PIN configurado, no se puede pedir autorización
        pinModal = { expectedList: validPins, message: steps[idx], onConfirm: () => runSteps(idx + 1) };
        render();
      };
      runSteps(0);
    };

    // tabla de la cuenta actual
    const ticketBox = wrap.querySelector('#ticket-box');
    if (ticket.items.length > 0){
      const table = el(`<table class="esth-table"><thead><tr><th>Servicio</th><th style="text-align:right;">Monto</th><th></th></tr></thead><tbody></tbody></table>`);
      const tbody = table.querySelector('tbody');
      ticket.items.forEach(i => {
        const insumosResumen = (i.insumosUsados || []).map(p => p.label + (p.mode === 'cantidad' ? ` ${p.qtyRaw}${p.unit==='ml'?'ml':'g'}` : '')).join(', ');
        const row = el(`<tr><td>${i.serviceName}${insumosResumen ? `<br><span style="font-size:11px;color:var(--ink-soft);">Insumos: ${insumosResumen} (${money(i.descuentoInsumos||0)})</span>` : ''}</td>
          <td class="esth-money" style="text-align:right;vertical-align:top;">${money(i.price)}</td>
          <td style="text-align:right;vertical-align:top;"><button class="esth-icon-btn">Quitar</button></td></tr>`);
        row.querySelector('button').onclick = () => { ticket.items = ticket.items.filter(x => x.id !== i.id); if (ticket.items.length===0){ ticket.stylistId = null; ticket.stylistExternal = null; } render(); };
        tbody.appendChild(row);
      });
      ticketBox.appendChild(table);
      ticketBox.appendChild(el(`<p class="esth-row" style="margin-top:8px;"><strong>Subtotal de la cuenta</strong><strong class="esth-money">${money(ticketTotal)}</strong></p>`));
    } else {
      ticketBox.appendChild(el(`<p class="esth-empty">Agrega uno o más servicios para el mismo estilista antes de cobrar.</p>`));
    }

    const methodSel = wrap.querySelector('#sel-method');
    wrap.querySelector('#btn-cobrar').onclick = () => {
      if (ticket.items.length === 0) return;
      const stylist = ticket.stylistId ? b.stylists.find(e => e.id === ticket.stylistId) : null;
      const stylistNameForSale = ticket.stylistExternal
        ? `${ticket.stylistExternal.name} (invitado — ${ticket.stylistExternal.origen})`
        : (stylist ? stylist.name : '—');
      const finish = async (cashReceived) => {
        const ticketId = uid('tk');
        ticket.items.forEach(i => {
          b.sales.unshift({ id: uid('v'), type: 'servicio', serviceName: i.serviceName, basePrice: i.basePrice, price: i.price,
            stylistName: stylistNameForSale, externalStylist: ticket.stylistExternal || null, method: methodSel.value, cashReceived, descuentoInsumos: i.descuentoInsumos, ticketId, date: new Date().toISOString() });
        });
        ticket = { stylistId: null, stylistExternal: null, items: [] };
        await save(); render();
      };
      if (methodSel.value === 'Efectivo'){ cashModal = { total: ticketTotal, onConfirm: (recibido) => finish(recibido) }; render(); }
      else finish(null);
    };

    const prodSelect = wrap.querySelector('#prod-select');
    const prodPrecio = wrap.querySelector('#prod-precio');
    const prodComision = wrap.querySelector('#prod-comision');
    const prodBtn = wrap.querySelector('#btn-producto');
    const prodBarcode = wrap.querySelector('#prod-barcode');
    const prodMsg = wrap.querySelector('#prod-msg');
    const applyProductSelection = () => {
      const opt = prodSelect.selectedOptions[0];
      if (opt && opt.value){
        prodPrecio.value = money(parseFloat(opt.dataset.price));
        prodComision.value = money(parseFloat(opt.dataset.commission));
        prodBtn.disabled = false;
      } else {
        prodPrecio.value = ''; prodComision.value = ''; prodBtn.disabled = true;
      }
    };
    prodSelect.addEventListener('change', applyProductSelection);
    applyProductSelection();
    if (prodBarcode) prodBarcode.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const code = prodBarcode.value.trim();
      const match = b.products.find(p => p.barcode && p.barcode === code);
      if (match){ prodSelect.value = match.id; applyProductSelection(); prodMsg.textContent = ''; prodBarcode.value = ''; }
      else { prodMsg.textContent = 'No se encontró ningún producto con ese código.'; }
    });
    prodBtn.onclick = async () => {
      const opt = prodSelect.selectedOptions[0];
      if (!opt || !opt.value) return;

        <button class="esth-btn block" id="submit">Entrar</button>
      </div></div>`);
    wrap.querySelector('#back').onclick = () => { view = { screen: 'role', branchId: b.id, error: '' }; render(); };
    const doLogin = () => {
      const u = wrap.querySelector('#in-user').value.trim();
      const p = wrap.querySelector('#in-pass').value;
      const match = state.admins.find(a => a.user === u && a.pass === p);
      if (!match) { view = { ...view, error: 'Usuario o contraseña incorrectos.' }; render(); return; }
      if (match.role === 'cajero'){ view = { ...view, error: 'Este usuario es de tipo Cajero: entra por la opción "Cajero" en la pantalla anterior.' }; render(); return; }
      if (match.role !== 'propietario' && !match.branchIds.includes(b.id)){ view = { ...view, error: 'Este usuario no tiene autorización para administrar esta sucursal.' }; render(); return; }
      view = { ...view, screen: 'admin', adminTab: 'resumen', error: '', adminUserId: match.id };
      render();
    };
    wrap.querySelector('#submit').onclick = doLogin;
    wrap.querySelector('#in-pass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    return wrap;
  }

      const [nameInput, addrInput, cUserInput, cPassInput] = row.querySelectorAll('input');
      nameInput.onchange = async () => { br.name = nameInput.value.trim() || br.name; await save(); render(); };
      addrInput.onchange = async () => { br.address = addrInput.value.trim(); await save(); };
      cUserInput.onchange = async () => { br.cashier.user = cUserInput.value.trim() || br.cashier.user; await save(); };
      cPassInput.onchange = async () => { br.cashier.pass = cPassInput.value || br.cashier.pass; await save(); };
      row.querySelector('button').onclick = async () => {
        if (state.branches.length<=1) return;
        state.branches = state.branches.filter(x => x.id !== br.id);
        state.admins.forEach(a => { a.branchIds = a.branchIds.filter(id => id !== br.id); });
        await save(); render();
      };
      tbody.appendChild(row);
    });
    return wrap;
  }

  function adminUsuarios(){
    const wrap = el(`<div>
      <p class="esth-legend" style="font-weight:600;margin-bottom:10px;">Administradores</p>
      <p class="esth-hint" style="margin-bottom:12px;">El "PIN de autorización" es opcional y sirve para que un encargado pueda autorizar en su propia sucursal cambios de precio o de insumos sin necesitar al propietario (que no siempre está disponible). Es distinto de la contraseña de acceso.</p>
      <table class="esth-table" style="margin-bottom:22px;"><thead><tr><th>Usuario</th><th>Contraseña</th><th>Rol</th><th>Sucursales</th><th>PIN de autorización</th><th></th></tr></thead><tbody id="adm-body"></tbody></table>

      <p class="esth-section-title">Crear administrador</p>
      <div class="esth-card">
        <div class="esth-grid2">
          <div class="esth-field"><label>Usuario</label><input id="new-adm-user" type="text"/></div>
          <div class="esth-field"><label>Contraseña</label><input id="new-adm-pass" type="text"/></div>
        </div>
        <div class="esth-field"><label>Rol</label><select id="new-adm-role">
          <option value="cajero">Cajero (solo cobra, sucursales seleccionadas)</option>
          <option value="encargado">Encargado (solo sucursales seleccionadas)</option>
          <option value="propietario">Propietario (todas las sucursales)</option>
        </select></div>
        <div class="esth-field" id="branch-check-wrap"><label>Sucursales que puede administrar / donde puede cobrar</label>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${state.branches.map(br => `<label style="font-size:13px;display:flex;gap:6px;align-items:center;">
              <input type="checkbox" class="new-adm-branch" value="${br.id}"/> ${br.name}</label>`).join('')}
          </div>
        </div>
        <div class="esth-field" id="new-adm-pin-wrap"><label>PIN de autorización (opcional, solo aplica a encargados/propietarios para autorizar precios/insumos en caja)</label><input id="new-adm-pin" type="text" maxlength="10"/></div>
        <button class="esth-btn" id="create-adm">Crear administrador</button>
        <div id="create-adm-msg"></div>
      </div>
    </div>`);

    const tbody = wrap.querySelector('#adm-body');
    const roleLabel = (r) => r === 'propietario' ? 'Propietario' : r === 'cajero' ? 'Cajero' : 'Encargado';
    state.admins.forEach(a => {
      const branchNames = a.role === 'propietario' ? 'Todas' : a.branchIds.map(id => (state.branches.find(x=>x.id===id)||{}).name).filter(Boolean).join(', ') || '—';
      const row = el(`<tr>
        <td><input type="text" value="${a.user}" style="border:none;background:none;width:100%;font-size:13px;font-family:inherit;color:var(--ink);"/></td>
        <td><input type="text" value="${a.pass}" style="border:none;background:none;width:90px;font-size:13px;font-family:inherit;color:var(--ink);"/></td>
        <td>${roleLabel(a.role)}</td>
        <td>${branchNames}</td>
        <td>${a.role === 'cajero' ? '—' : `<input type="text" value="${a.pin||''}" maxlength="10" placeholder="Sin PIN" style="border:none;background:none;width:80px;font-size:13px;font-family:inherit;color:var(--ink);letter-spacing:2px;"/>`}</td>
        <td style="text-align:right;"><button class="esth-icon-btn" ${state.admins.length<=1?'disabled':''}>Eliminar</button></td>
      </tr>`);
      const [userInput, passInput, pinInput] = row.querySelectorAll('input');
      userInput.onchange = async () => { a.user = userInput.value.trim() || a.user; await save(); };
      passInput.onchange = async () => { a.pass = passInput.value || a.pass; await save(); };
      if (pinInput) pinInput.onchange = async () => { a.pin = pinInput.value.trim(); await save(); };
      row.querySelector('button').onclick = async () => {
        if (state.admins.length<=1) return;
        state.admins = state.admins.filter(x => x.id !== a.id);
        await save(); render();
      };
      tbody.appendChild(row);
    });

    const roleSel = wrap.querySelector('#new-adm-role');
    const branchWrap = wrap.querySelector('#branch-check-wrap');
    const pinWrap = wrap.querySelector('#new-adm-pin-wrap');
    const syncRoleFields = () => {
      branchWrap.style.opacity = roleSel.value === 'propietario' ? '0.4' : '1';
      pinWrap.style.display = roleSel.value === 'cajero' ? 'none' : 'block';
    };
    roleSel.addEventListener('change', syncRoleFields);
    syncRoleFields();

    wrap.querySelector('#create-adm').onclick = () => {
      const user = wrap.querySelector('#new-adm-user').value.trim();
      const pass = wrap.querySelector('#new-adm-pass').value;
      const pin = roleSel.value === 'cajero' ? '' : wrap.querySelector('#new-adm-pin').value.trim();
      const role = roleSel.value;
      const branchIds = Array.from(wrap.querySelectorAll('.new-adm-branch:checked')).map(c => c.value);
      if (!user || !pass) return;
      if (role !== 'propietario' && branchIds.length === 0){
        wrap.querySelector('#create-adm-msg').innerHTML = '<p class="esth-error" style="margin-top:10px;">Selecciona al menos una sucursal.</p>';
        return;
      }
      pinModal = {
        expected: state.settings.masterPin,
        title: 'Clave maestra',
        message: 'Ingresa la clave maestra para crear un nuevo administrador.',
        onConfirm: async () => {
          state.admins.push({ id: uid('a'), user, pass, role, branchIds: role === 'propietario' ? [] : branchIds, pin });
          await save(); render();
        }
      };
      render();
    };
    return wrap;
  }

  function adminConfig(){
    const wrap = el(`<div class="esth-card" style="max-width:420px;">
      <p class="esth-legend" style="font-weight:600;margin-bottom:10px;">Datos generales y claves</p>
      <div class="esth-field"><label>Nombre de la cadena</label><input id="cfg-chain" type="text" value="${state.chainName}"/></div>
      <div class="esth-field"><label>Clave maestra (para crear administradores)</label><input id="cfg-master" type="text" maxlength="12" value="${state.settings.masterPin}"/></div>
      <div class="esth-field"><label>PIN maestro para autorizar cambios de precio (dejar vacío para desactivar)</label>
        <input id="cfg-pin" type="text" maxlength="10" value="${state.settings.priceOverridePin}"/>
        <p class="esth-hint">Además de este PIN, cualquier encargado con un "PIN de autorización" configurado en la pestaña Usuarios podrá autorizar estos cambios en las sucursales que administra, sin necesitar al propietario.</p>
      </div>
      <button class="esth-btn" id="cfg-save">Guardar cambios</button>
      <div id="cfg-msg"></div>
    </div>`);
    wrap.querySelector('#cfg-save').onclick = async () => {
      state.chainName = wrap.querySelector('#cfg-chain').value.trim() || state.chainName;
      state.settings.masterPin = wrap.querySelector('#cfg-master').value.trim() || state.settings.masterPin;
      state.settings.priceOverridePin = wrap.querySelector('#cfg-pin').value.trim();
      await save();
      wrap.querySelector('#cfg-msg').innerHTML = '<p class="esth-ok" style="margin-top:12px;">Cambios guardados.</p>';
    };
    return wrap;
  }

  const screens = { home: screenHome, role: screenRole, cashierLogin: screenCashierLogin, cashier: screenCashier, adminLogin: screenAdminLogin, admin: screenAdmin };

  (async function init(){
    root().innerHTML = '<div class="esth-root" style="padding:40px;text-align:center;color:#6E5A5C;">Cargando…</div>';
    await load();
    render();
  })();
})();
</script>
</body>
</html>
